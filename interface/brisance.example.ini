# BRISANCE settings
# Edit the values after '='. Do not paste this file into the terminal.
# Paths must be absolute. Quotes around paths are optional.
# Keep one file per line in lists; R1/R2 mates must have the same list order.
# The runner generates pair identifiers and the samplesheet automatically.

[analysis]
folder = /data/analysis_01

[tumor]
sample = TUMOR_01
r1 =
    /data/tumor_R1.fastq.gz
r2 =
    /data/tumor_R2.fastq.gz

[normal]
sample = NORMAL_01
r1 =
    /data/normal_R1.fastq.gz
r2 =
    /data/normal_R2.fastq.gz

[reference]
fasta = /references/GRCh38.fasta
assembly = GRCh38
known_sites =
    /references/known-sites/known_indels_1.vcf.gz
    /references/known-sites/known_indels_2.vcf.gz
    /references/known-sites/known_snps.vcf.gz
vep_cache = /references/vep_cache
vep_cache_version = 113

[trimming]
# auto: automatic adapter detection; leave adapter sequences empty.
# custom: fill BOTH adapter_r1 and adapter_r2 with DNA sequences.
adapters = auto
adapter_r1 =
adapter_r2 =
quality = 20
min_read_length = 20

[alignment]
gpus = 0,2,4
bwa_thread_pool = 16
cpu_limit = 64
memory_gb = 256
sorting_memory_gb = 128

[bqsr]
gpu = 0
threads = 16
cpu_limit = 24
memory_gb = 128

[calling]
gpus = 0,2
threads = 24
cpu_limit = 64
memory_gb = 256

[annotation]
forks = 8
cpu_limit = 10
memory_gb = 32

# Additional resource limits; normally keep these settings unchanged.
# CPU quotas are not the same as the tool's thread parameter.
# Trim Galore 0.4.4 does not gain multi-core trimming from a higher CPU quota.
[trim_resources]
cpu_limit = 2
memory_gb = 100
fastqc_heap_gb = 8

[read_groups]
cpu_limit = 10
memory_gb = 8
index_threads = 8

[filtering]
cpu_limit = 4
memory_gb = 16
java_heap_gb = 8

[utilities]
cpu_limit = 2
memory_gb = 4

[runtime]
# Leave blank to use installed executables from the current environment.
java =
nextflow =
check_environment = true
# true offers a separate yes/no confirmation for each required image download.
# false never downloads images. Analysis requires --run and a final confirmation.
allow_downloads = true
