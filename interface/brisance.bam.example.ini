# Optional v1.1.0 entry point: already processed, coordinate-sorted BAMs.
[analysis]
folder = /analyses/patient_01_pon
input_mode = bam

[tumor]
sample = P01_TUMOR
bam = /data/P01_TUMOR.bam
# bam_index defaults to the BAM path followed by .bai.

[normal]
sample = P01_NORMAL
bam = /data/P01_NORMAL.bam

[reference]
fasta = /references/GRCh38.fasta
assembly = GRCh38
vep_cache = /references/vep_cache
vep_cache_version = 113
# BAM mode needs FASTA, .fai and .dict, but no BWA indexes or known_sites.

[somatic]
# Leave empty to disable the PoN. The matched-normal BAM is still required.
pon = /references/my_panel.vcf.gz
# false prepares an index in managed work; true requires validated adjacent .pon.
pon_prepared = false

[qc]
enabled = true

# Read-orientation artifacts. Choose off, auto (learn during calling), or provided.
[orientation]
mode = off
# For provided only, enter the tumor's GATK orientation-priors archive.
priors =

# Cross-sample contamination. Choose off, auto (use the matched normal), or provided.
[contamination]
mode = off
# For auto, enter a reference-matched common-SNP VCF with INFO/AF and an adjacent .tbi.
sites =
# For provided, enter the tumor contamination table and optionally its segments table.
table =
segments =

[calling]
gpus = 0
cpu_limit = 32
memory_gb = 128
threads = 16

# Also used by independent QC and PoN GPU utilities in this version.
[read_groups]
cpu_limit = 4
memory_gb = 32
index_threads = 2

[annotation]
cpu_limit = 8
memory_gb = 32
forks = 4

[filtering]
cpu_limit = 4
memory_gb = 16
java_heap_gb = 8

[utilities]
cpu_limit = 4
memory_gb = 8

[runtime]
java =
nextflow =
check_environment = true
allow_downloads = false
